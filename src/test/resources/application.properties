spring.application.name=platform
server.port=0

spring.datasource.url=jdbc:postgresql://127.0.0.1:5433/vidayoung_test
spring.datasource.username=vidayoung_user
spring.datasource.password=vidayoung0225
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
